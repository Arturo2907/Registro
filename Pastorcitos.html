<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastorcitos</title>
  <link rel="icon" type="image/png" href="pastor.png">
  

  <!-- Librerías para generar el archivo PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <!-- Módulos de Firebase importados desde CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, push, get} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyDzCN7HFTHn7_LJjeEo1zMNel4mUPYeJHU",
      authDomain: "registro-f2721.firebaseapp.com",
      databaseURL: "https://registro-f2721-default-rtdb.firebaseio.com",
      projectId: "registro-f2721",
      storageBucket: "registro-f2721.firebasestorage.app",
      messagingSenderId: "775332929257",
      appId: "1:775332929257:web:2242ac68ba55e3e6051a78",
      measurementId: "G-LB02681RZV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ninosRef = ref(db, 'ninos');
    const historialRef = ref(db, 'historial_pastorcitos');

    const EDAD_MIN = 7;
    const EDAD_MAX = 9;

    let historialMovimientos = [];

    // Escuchar historial en tiempo real
    onValue(historialRef, (snapshot) => {
      const data = snapshot.val();
      historialMovimientos = [];
      if (data) {
        for (let id in data) {
          historialMovimientos.push(data[id]);
        }
      }
    });

    // Escuchar niños en tiempo real
    onValue(ninosRef, (snapshot) => {
      const data = snapshot.val();
      const contenedor = document.getElementById('contenedor');

      if (!data) {
        contenedor.innerHTML = '<p style="background:white; padding:15px; border-radius:8px;">No hay niños registrados.</p>';
        return;
      }

      let html = '';
      let hayPastorcitos = false;

      for (let id in data) {
        const n = data[id];
        const edad = Number(n.edad);
        
        if (edad >= EDAD_MIN && edad <= EDAD_MAX) {
          hayPastorcitos = true;
          const saldoNum = Number(n.saldo) || 0;

          html += `
            <div class="row-card">
              <div class="info-nino">
                <span class="nombre">${n.nombre}</span>
                <span class="edad">(${edad} años)</span>
              </div>

              <div class="saldo">$${saldoNum.toFixed(2)}</div>

              <div class="acciones">
                <div class="action-group">
                  <input type="number" id="add-${id}" placeholder="Ganó" min="0" step="0.5">
                  <button class="btn-add" onclick="window.modificarSaldo('${id}', '${n.nombre}', ${saldoNum}, 'add-${id}', true)">+ Sumar</button>
                </div>

                <div class="action-group">
                  <input type="number" id="sub-${id}" placeholder="Multa" min="0" step="0.5">
                  <button class="btn-sub" onclick="window.modificarSaldo('${id}', '${n.nombre}', ${saldoNum}, 'sub-${id}', false)">- Restar</button>
                </div>
              </div>
            </div>
          `;
        }
      }

      contenedor.innerHTML = hayPastorcitos ? html : '<p style="background:white; padding:15px; border-radius:8px;">No hay niños de 7 a 9 años.</p>';
    });

    // Modificar saldo y registrar movimiento
    // Importar 'get' de firebase-database en la parte superior del script:
// import { initializeApp } from "...";
// import { getDatabase, ref, onValue, update, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

window.modificarSaldo = function(id, nombreNino, _, inputId, esSuma) {
  const input = document.getElementById(inputId);
  const valor = parseFloat(input.value);

  if (!isNaN(valor) && valor > 0) {
    const ninoRef = ref(db, `ninos/${id}`);

    // Obtenemos el saldo actual directo de Firebase en el momento exacto del clic
    get(ninoRef).then((snapshot) => {
      if (snapshot.exists()) {
        const ninoData = snapshot.val();
        const saldoActualEnNube = parseFloat(ninoData.saldo) || 0;

        let nuevoSaldo = saldoActualEnNube + (esSuma ? valor : -valor);
        if (nuevoSaldo < 0) nuevoSaldo = 0;

        // Actualizamos en Firebase
        update(ninoRef, { saldo: nuevoSaldo });

        // Guardamos el historial de movimientos
        const ahora = new Date();
        const horaFormateada = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const fechaFormateada = ahora.toLocaleDateString();

        const movimiento = {
          nombre: nombreNino,
          tipo: esSuma ? 'Ganó' : 'Descontó',
          monto: `${esSuma ? '+' : '-'}$${valor.toFixed(2)}`,
          hora: `${fechaFormateada} ${horaFormateada}`
        };

        push(historialRef, movimiento);
        input.value = '';
      }
    }).catch((error) => {
      console.error("Error al actualizar el saldo:", error);
      alert("Hubo un error de conexión al actualizar el saldo.");
    });
  }
};
    
    // Función para descargar PDF agrupado y ordenado por niño
    window.descargarPDF = function() {
      if (historialMovimientos.length === 0) {
        alert("Aún no se ha realizado ningún movimiento.");
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(18);
      doc.text("Historial de movimientos", 14, 20);

      doc.setFontSize(11);
      doc.setTextColor(100);
      doc.text("Grupo: Pastorcitos (7 a 9 años)", 14, 27);

      const agrupado = {};
      historialMovimientos.forEach(m => {
        if (!agrupado[m.nombre]) {
          agrupado[m.nombre] = [];
        }
        agrupado[m.nombre].push(m);
      });

      const nombresOrdenados = Object.keys(agrupado).sort((a, b) => a.localeCompare(b));

      let currentY = 34;

      nombresOrdenados.forEach((nombre) => {
        const movimientos = agrupado[nombre];

        doc.setFontSize(13);
        doc.setTextColor(26, 37, 47);
        doc.setFont(undefined, 'bold');
        doc.text(`Niño(a): ${nombre}`, 14, currentY);
        currentY += 4;

        const filas = movimientos.map(m => [m.tipo, m.monto, m.hora]);

        doc.autoTable({
          startY: currentY,
          head: [['Acción', 'Monto', 'Hora / Fecha']],
          body: filas,
          theme: 'striped',
          headStyles: { fillColor: [0, 123, 255] },
          styles: { fontSize: 9.5 },
          margin: { left: 14, right: 14 }
        });

        currentY = doc.lastAutoTable.finalY + 10;
      });

      doc.save(`Historial_Pastorcitos_${new Date().toISOString().slice(0,10)}.pdf`);
    };
  </script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; background: #ebf1f5; color: #333; }
    .header-panel { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 10px; }
    h1 { color: #1a252f; margin: 0; font-size: 1.8em; }
    .btn-pdf { background: #e74c3c; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: background 0.2s; width: 100%; text-align: center; }
    .btn-pdf:hover { background: #c0392b; }
    @media (min-width: 600px) { .btn-pdf { width: auto; } }
    .lista { display: flex; flex-direction: column; gap: 12px; }
    .row-card { background: white; padding: 14px 20px; border-radius: 10px; box-shadow: 0 3px 8px rgba(0,0,0,0.06); border-left: 6px solid #007bff; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
    .info-nino { display: flex; align-items: center; gap: 10px; min-width: 180px; }
    .nombre { font-size: 1.15em; font-weight: 700; color: #212529; }
    .edad { color: #6c757d; font-size: 0.95em; }
    .saldo { font-size: 1.35em; font-weight: 800; color: #28a745; min-width: 100px; text-align: center; }
    .acciones { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .action-group { display: flex; align-items: center; gap: 6px; }
    input[type="number"] { width: 75px; padding: 7px 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; outline: none; }
    input[type="number"]:focus { border-color: #007bff; }
    button { cursor: pointer; border: none; padding: 8px 14px; border-radius: 6px; color: white; font-weight: bold; font-size: 14px; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-add { background: #28a745; }
    .btn-sub { background: #dc3545; }
  </style>
</head>
<body>

  <div class="header-panel">
    <div class="top-bar">
      <h1>Pastorcitos</h1>
    </div>
    <button class="btn-pdf" onclick="descargarPDF()">📄 Descargar Historial (PDF)</button>
  </div>

  <div id="contenedor" class="lista"></div>

</body>
</html>
