<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Principal - Registro y Control</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Módulos de Firebase para sincronización en tiempo real entre dispositivos -->
  <script type="module">
    // Import the functions you need from the SDKs you need
  import { initializeApp } from "firebase/app";
  import { getAnalytics } from "firebase/analytics";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyDzCN7HFTHn7_LJjeEo1zMNel4mUPYeJHU",
    authDomain: "registro-f2721.firebaseapp.com",
    databaseURL: "https://registro-f2721-default-rtdb.firebaseio.com",
    projectId: "registro-f2721",
    storageBucket: "registro-f2721.firebasestorage.app",
    messagingSenderId: "775332929257",
    appId: "1:775332929257:web:2242ac68ba55e3e6051a78",
        measurementId: "G-LB02681RZV"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const ninosRef = ref(db, 'ninos');

    let listaNinosGlobal = [];

    function obtenerGrupo(edad) {
      if (edad >= 4 && edad <= 6) return 'Peques (4-6 años)';
      if (edad >= 7 && edad <= 9) return 'Medianos (7-9 años)';
      if (edad >= 10) return 'Mayores (10+ años)';
      return 'Sin Grupo';
    }

    // Registrar niño en la nube
    document.getElementById('formRegistro').addEventListener('submit', (e) => {
      e.preventDefault();
      const nuevoNino = {
        nombre: document.getElementById('nombre').value.trim(),
        edad: parseInt(document.getElementById('edad').value),
        saldo: parseFloat(document.getElementById('saldo').value)
      };
      push(ninosRef, nuevoNino);
      document.getElementById('formRegistro').reset();
    });

    // Escuchar cambios de la nube en TIEMPO REAL
    onValue(ninosRef, (snapshot) => {
      const data = snapshot.val();
      const tabla = document.getElementById('tablaNinos');
      listaNinosGlobal = [];
      
      if (!data) {
        tabla.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888;">No hay niños registrados aún.</td></tr>';
        return;
      }

      let html = '';
      for (let id in data) {
        const n = data[id];
        listaNinosGlobal.push({ id, ...n });
        html += `
          <tr>
            <td><strong>${n.nombre}</strong></td>
            <td>${n.edad} años</td>
            <td>${obtenerGrupo(n.edad)}</td>
            <td style="color: #28a745;"><strong>$${n.saldo.toFixed(2)}</strong></td>
            <td><button class="btn-del" onclick="window.eliminarNino('${id}')">Eliminar</button></td>
          </tr>
        `;
      }
      tabla.innerHTML = html;
    });

    // Eliminar niño de la nube
    window.eliminarNino = function(id) {
      if (confirm('¿Estás seguro de que deseas eliminar este registro?')) {
        remove(ref(db, `ninos/${id}`));
      }
    };

    // Exportar a Excel
    window.exportarExcel = function() {
      if (listaNinosGlobal.length === 0) {
        alert('No hay datos registrados para exportar.');
        return;
      }
      const datosExcel = listaNinosGlobal.map(n => ({
        'Nombre': n.nombre,
        'Edad': n.edad,
        'Grupo': obtenerGrupo(n.edad),
        'Saldo Actual ($)': n.saldo
      }));

      const worksheet = XLSX.utils.json_to_sheet(datosExcel);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Registro Niños");
      XLSX.writeFile(workbook, `Reporte_Niños_${new Date().toISOString().slice(0, 10)}.xlsx`);
    };
  </script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 20px; background: #f4f6f9; color: #333; }
    h1 { color: #1a252f; text-align: center; }
    .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.08); margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .btn { border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-primary { background: #28a745; color: white; }
    .btn-excel { background: #1d6f42; color: white; }
    nav { display: flex; justify-content: space-around; background: #ffffff; padding: 15px; border-radius: 8px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    nav a { color: #007bff; text-decoration: none; font-weight: bold; }
    .table-responsive { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; white-space: nowrap; }
    th { background: #f8fafc; font-weight: 600; color: #475569; }
    tr:nth-child(even) { background-color: #f8fafc; }
    .btn-del { background: #dc3545; color: white; padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
    .flex-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
  </style>
</head>
<body>

  <h1>Control Central de Niños (Nube)</h1>
  
  <nav>
    <strong>Paneles por Edad:</strong>
    <a href="peques.html" target="_blank">Peques (4 - 6 años)</a>
    <a href="medianos.html" target="_blank">Medianos (7 - 9 años)</a>
    <a href="mayores.html" target="_blank">Mayores (10+ años)</a>
  </nav>

  <div class="card">
    <h2>Registrar Nuevo Niño</h2>
    <form id="formRegistro">
      <div class="form-group">
        <label>Nombre:</label>
        <input type="text" id="nombre" required placeholder="Ej. Mateo">
      </div>
      <div class="form-group">
        <label>Edad:</label>
        <input type="number" id="edad" min="1" max="18" required placeholder="Ej. 5">
      </div>
      <div class="form-group">
        <label>Saldo Inicial ($):</label>
        <input type="number" id="saldo" min="0" step="0.5" value="0" required>
      </div>
      <button type="submit" class="btn btn-primary">Guardar Niño</button>
    </form>
  </div>

  <div class="card">
    <div class="flex-header">
      <h2 style="margin: 0;">Lista General y Reporte</h2>
      <button class="btn btn-excel" onclick="exportarExcel()">📊 Descargar Excel (.xlsx)</button>
    </div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Grupo Asignado</th>
            <th>Saldo Actual</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaNinos"></tbody>
      </table>
    </div>
  </div>

</body>
</html>
